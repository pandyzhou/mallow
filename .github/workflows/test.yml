# 推送和 PR 时检查代码并运行测试（不开窗口的界面测试）。
name: 测试

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 格式检查
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: 检查
        run: go vet ./...
      - name: 测试
        run: go test ./...
